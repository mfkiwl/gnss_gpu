<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">RB-FGO-PF Tokyo PPC FIX benchmark</title>
  <desc id="desc">Grouped bars compare correct FIX epochs as a share of rover epochs on three Tokyo PPC runs for RB-FGO-PF WP45 (3-seed mean), libgnss++ KF-RTK, libgnss++ GTSAM FGO and inuex35; a second panel shows the share of each system's FIX epochs that are wrong.</desc>
