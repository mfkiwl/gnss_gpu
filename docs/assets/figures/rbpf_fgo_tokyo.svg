  <text x="48" y="48" fill="#f0f6fc" font-family="system-ui,sans-serif" font-size="25" font-weight="700">Tokyo PPC: correct FIX at a wrong-FIX budget</text>
  <text x="48" y="76" fill="#8b949e" font-family="system-ui,sans-serif" font-size="14">One scorer for every system · a FIX is wrong when its 3D error is ≥ 0.5 m · RB-FGO-PF WP45: shipped configuration, mean of 3 seeds</text>
