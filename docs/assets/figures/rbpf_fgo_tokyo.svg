<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">RB-FGO-PF Tokyo PPC benchmark</title>
  <desc id="desc">Grouped bars compare matched 3D under-50-centimeter full-epoch accuracy on three Tokyo runs; RB-FGO-PF is the WP43 three-seed mean. A second panel shows its FixRMS.</desc>
  <rect width="960" height="520" rx="16" fill="#0d1117"/>
  <text x="48" y="48" fill="#f0f6fc" font-family="system-ui,sans-serif" font-size="25" font-weight="700">Tokyo PPC: integer-basin RB-FGO-PF</text>
  <text x="48" y="76" fill="#8b949e" font-family="system-ui,sans-serif" font-size="14">Matched 3D · missing rover epochs count as failures · WP43 shipped configuration, mean of 3 seeds</text>

  <g font-family="system-ui,sans-serif">
    <text x="48" y="116" fill="#f0f6fc" font-size="17" font-weight="600">&lt;50 cm full-epoch accuracy (%) ↑</text>
    <line x1="62" y1="384" x2="590" y2="384" stroke="#30363d"/>
    <line x1="62" y1="324" x2="590" y2="324" stroke="#21262d"/>
    <line x1="62" y1="264" x2="590" y2="264" stroke="#21262d"/>
    <line x1="62" y1="204" x2="590" y2="204" stroke="#21262d"/>
    <line x1="62" y1="144" x2="590" y2="144" stroke="#21262d"/>
    <g fill="#8b949e" font-size="12" text-anchor="end">
      <text x="54" y="388">0</text><text x="54" y="328">20</text><text x="54" y="268">40</text><text x="54" y="208">60</text><text x="54" y="148">80</text>
    </g>

    <!-- run 1: scale 3.0 px / percentage point from y=384 -->
    <rect x="105" y="214" width="32" height="170" rx="4" fill="#8b949e"/>
    <rect x="141" y="214" width="32" height="170" rx="4" fill="#58a6ff"/>
    <rect x="177" y="195" width="32" height="189" rx="4" fill="#3fb950"/>
    <g fill="#f0f6fc" font-size="11" text-anchor="middle"><text x="121" y="207">56.7</text><text x="157" y="207">56.8</text><text x="193" y="188">63.1</text></g>

    <!-- run 2 -->
    <rect x="275" y="174" width="32" height="210" rx="4" fill="#8b949e"/>
    <rect x="311" y="142" width="32" height="242" rx="4" fill="#58a6ff"/>
    <rect x="347" y="136" width="32" height="248" rx="4" fill="#3fb950"/>
    <g fill="#f0f6fc" font-size="11" text-anchor="middle"><text x="291" y="167">69.9</text><text x="327" y="135">80.5</text><text x="363" y="129">82.7</text></g>

    <!-- run 3 -->
    <rect x="445" y="180" width="32" height="204" rx="4" fill="#8b949e"/>
    <rect x="481" y="166" width="32" height="218" rx="4" fill="#58a6ff"/>
    <rect x="517" y="124" width="32" height="260" rx="4" fill="#3fb950"/>
    <g fill="#f0f6fc" font-size="11" text-anchor="middle"><text x="461" y="173">67.9</text><text x="497" y="159">72.8</text><text x="533" y="117">86.7</text></g>
    <g fill="#c9d1d9" font-size="14" text-anchor="middle"><text x="157" y="410">run1</text><text x="327" y="410">run2</text><text x="497" y="410">run3</text></g>
    <g font-size="12"><rect x="82" y="445" width="14" height="14" rx="2" fill="#8b949e"/><text x="103" y="457" fill="#c9d1d9">inuex35 README</text><rect x="225" y="445" width="14" height="14" rx="2" fill="#58a6ff"/><text x="246" y="457" fill="#c9d1d9">libgnss++ GTSAM (2D reference)</text><rect x="460" y="445" width="14" height="14" rx="2" fill="#3fb950"/><text x="481" y="457" fill="#c9d1d9">RB-FGO-PF WP43 (3D)</text></g>

    <line x1="620" y1="104" x2="620" y2="470" stroke="#30363d"/>
    <text x="654" y="116" fill="#f0f6fc" font-size="17" font-weight="600">FixRMS (m) ↓</text>
    <g fill="#8b949e" font-size="12"><text x="654" y="151">run1</text><text x="654" y="231">run2</text><text x="654" y="311">run3</text></g>
    <g>
      <rect x="704" y="132" width="187" height="28" rx="6" fill="#21262d"/><rect x="704" y="132" width="166" height="28" rx="6" fill="#3fb950"/><text x="878" y="151" fill="#f0f6fc" font-size="13">0.178</text>
      <rect x="704" y="212" width="187" height="28" rx="6" fill="#21262d"/><rect x="704" y="212" width="68" height="28" rx="6" fill="#3fb950"/><text x="780" y="231" fill="#f0f6fc" font-size="13">0.073</text>
      <rect x="704" y="292" width="187" height="28" rx="6" fill="#21262d"/><rect x="704" y="292" width="51" height="28" rx="6" fill="#3fb950"/><text x="763" y="311" fill="#f0f6fc" font-size="13">0.055</text>
    </g>
    <text x="654" y="360" fill="#8b949e" font-size="13">Median fixed error: 2.4–2.7 cm</text>
    <text x="654" y="384" fill="#8b949e" font-size="13">PPC OFFICIAL: 63.7 / 85.1 / 86.9%</text>
    <rect x="654" y="414" width="260" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="670" y="437" fill="#d29922" font-size="12" font-weight="600">False fixes (nb ≥ 12 floor)</text>
    <text x="670" y="457" fill="#c9d1d9" font-size="12">0.33 / 0.16 / 0.10% of fixes</text>
  </g>
</svg>
