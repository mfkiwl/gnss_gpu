<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
  <title id="title">RB-FGO-PF Tokyo PPC FIX benchmark</title>
  <desc id="desc">Grouped bars compare correct FIX epochs as a share of rover epochs on the six Tokyo and Nagoya PPC runs for RB-FGO-PF WP50 (real time and with a 15 s fixed-lag smoother) and libgnss++ KF-RTK; a second panel shows the share of each system's FIX epochs that are wrong.</desc>
